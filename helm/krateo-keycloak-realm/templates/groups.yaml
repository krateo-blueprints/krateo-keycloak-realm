{{- $v := include "kr.values" . | fromYaml }}
{{- include "kr.check" . }}
{{- range $v.groups }}
---
apiVersion: {{ $v.resourceGroup }}/v1
kind: KeycloakGroup
metadata:
  name: {{ printf "%s-%s" (include "kr.objName" $v.realm.name) (include "kr.objName" .name) | trunc 63 | trimSuffix "-" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kr.labels" $ | nindent 4 }}
  annotations:
    {{- include "kr.deletionPolicy" $ | nindent 4 }}
spec:
  {{- include "kr.configurationRef" $ | nindent 2 }}
  realm: {{ $v.realm.name | quote }}
  name: {{ .name | quote }}
  {{- with .attributes }}
  attributes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
