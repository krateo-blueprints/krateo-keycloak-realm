{{- $v := include "kr.values" . | fromYaml }}
{{- include "kr.check" . }}
{{- $kinds := list "KeycloakRealmConfiguration" "KeycloakGroupConfiguration" "KeycloakUserConfiguration" }}
{{- if or $v.parentClient.enabled $v.clients $v.identityLifecycle.enabled $v.ideClient.enabled }}
{{- $kinds = append $kinds "KeycloakClientConfiguration" }}
{{- end }}
{{- if $v.identityLifecycle.enabled }}
{{- $kinds = append $kinds "KeycloakServiceAccountRoleMappingConfiguration" }}
{{- end }}
{{- if $v.userProfile.enabled }}
{{- $kinds = append $kinds "KeycloakUserProfileConfiguration" }}
{{- end }}
{{- range $kinds }}
---
# How the KOG's {{ trimSuffix "Configuration" . }} controller authenticates: the bearer token that
# keycloak-config-kog keeps fresh in a Secret.
apiVersion: {{ $v.resourceGroup }}/v1alpha1
kind: {{ . }}
metadata:
  name: {{ $v.configuration.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kr.labels" $ | nindent 4 }}
  annotations:
    # Kept on uninstall: the realm/group/client CRs' finalizers DELETE their Keycloak objects through
    # this Configuration. If uninstall removed it in the same pass (helm deletes everything at once),
    # every CR would fail its delete forever ("... keycloak-admin not found"). It holds no secret, only
    # a pointer to the token Secret, and a reinstall under the same release name adopts it.
    helm.sh/resource-policy: keep
spec:
  authentication:
    bearer:
      tokenRef:
        name: {{ $v.configuration.tokenSecret.name }}
        namespace: {{ $.Release.Namespace }}
        key: {{ $v.configuration.tokenSecret.key }}
  {{- if eq . "KeycloakUserConfiguration" }}
  # The KOG's user findby asks Keycloak for ONE user (?username=<spec.username>&exact=true) instead of reading its
  # default first page of 100 users, where a user sorting beyond the page was created once and then never found
  # again (CreateOutcomeUnknown, measured 2026-11-18). `exact` is a KOG configurationField, so it lives here, on the
  # Configuration, not on the CR -- a user cannot turn it off. Needs keycloak-config-kog >= 0.11.0.
  configuration:
    query:
      findby:
        exact: true
  {{- end }}
{{- end }}
