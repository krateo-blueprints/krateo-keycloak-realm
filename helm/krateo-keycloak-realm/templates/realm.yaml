{{- $v := include "kr.values" . | fromYaml }}
{{- include "kr.check" . }}
{{- $r := $v.realm }}
apiVersion: {{ $v.resourceGroup }}/v1
kind: KeycloakRealm
metadata:
  name: {{ include "kr.objName" $r.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kr.labels" . | nindent 4 }}
  annotations:
    {{- include "kr.deletionPolicy" . | nindent 4 }}
spec:
  {{- include "kr.configurationRef" . | nindent 2 }}
  realm: {{ $r.name | quote }}
  enabled: {{ $r.enabled }}
  {{- with $r.displayName }}
  displayName: {{ . | quote }}
  {{- end }}
  registrationAllowed: {{ $r.registrationAllowed }}
  resetPasswordAllowed: {{ $r.resetPasswordAllowed }}
  verifyEmail: {{ $r.verifyEmail }}
  loginWithEmailAllowed: {{ $r.loginWithEmailAllowed }}
  actionTokenGeneratedByAdminLifespan: {{ int $r.actionTokenGeneratedByAdminLifespan }}
  eventsEnabled: {{ $r.events.enabled }}
  {{- with $r.events.types }}
  enabledEventTypes:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $r.events.listeners }}
  eventsListeners:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $r.events.expiration }}
  eventsExpiration: {{ int64 . }}
  {{- end }}
  adminEventsEnabled: {{ $r.adminEvents.enabled }}
  adminEventsDetailsEnabled: {{ $r.adminEvents.includeRepresentation }}
  {{- if and $r.adminEvents.enabled $r.events.expiration }}
  # Keycloak 26 keeps admin-event retention as a realm attribute, separate from eventsExpiration.
  attributes:
    adminEventsExpiration: {{ $r.events.expiration | int64 | toString | quote }}
  {{- end }}
  {{- if $r.smtp.enabled }}
  smtpServer:
    host: {{ $r.smtp.host | quote }}
    port: {{ $r.smtp.port | toString | quote }}
    from: {{ $r.smtp.from | quote }}
    {{- with $r.smtp.fromDisplayName }}
    fromDisplayName: {{ . | quote }}
    {{- end }}
    {{- with $r.smtp.replyTo }}
    replyTo: {{ . | quote }}
    {{- end }}
    auth: {{ $r.smtp.auth | toString | quote }}
    starttls: {{ $r.smtp.starttls | toString | quote }}
    ssl: {{ $r.smtp.ssl | toString | quote }}
    {{- /* Keycloak keeps authType only when auth is on (measured on 26.6.3); rendering it with auth
    "false" made the CR differ from the realm forever. */}}
    {{- if eq ($r.smtp.auth | toString) "true" }}
    authType: {{ $r.smtp.authType | quote }}
    {{- if eq $r.smtp.authType "token" }}
    authTokenUrl: {{ $r.smtp.token.url | quote }}
    authTokenClientId: {{ $r.smtp.token.clientId | quote }}
    authTokenScope: {{ $r.smtp.token.scope | quote }}
    {{- end }}
    {{- end }}
  {{- if eq ($r.smtp.auth | toString) "true" }}
  # The SMTP credentials: read by the controller from this Secret, never stored in the CR. Only the
  # key the chosen authType needs is declared.
  smtpCredentialsRef:
    name: {{ $r.smtp.credentialsSecret.name }}
    userKey: {{ $r.smtp.credentialsSecret.userKey }}
    {{- if eq $r.smtp.authType "token" }}
    clientSecretKey: {{ $r.smtp.credentialsSecret.clientSecretKey }}
    {{- else }}
    passwordKey: {{ $r.smtp.credentialsSecret.passwordKey }}
    {{- end }}
  {{- end }}
  {{- end }}
