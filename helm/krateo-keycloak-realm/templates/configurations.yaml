{{- $v := include "kr.values" . | fromYaml }}
{{- include "kr.check" . }}
{{- $kinds := list "KeycloakRealmConfiguration" "KeycloakGroupConfiguration" }}
{{- if $v.parentClient.enabled }}
{{- $kinds = append $kinds "KeycloakClientConfiguration" }}
{{- end }}
{{- if $v.userProfile.enabled }}
{{- $kinds = append $kinds "KeycloakUserProfileConfiguration" }}
{{- end }}
{{- range $kinds }}
---
# How the KOG's {{ trimSuffix "Configuration" . }} controller authenticates: the bearer token that
# keycloak-config-kog keeps fresh in a Secret.
apiVersion: {{ $v.resourceGroup }}/v1alpha1
kind: {{ . }}
metadata:
  name: {{ $v.configuration.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kr.labels" $ | nindent 4 }}
  annotations:
    # Kept on uninstall: the realm/group/client CRs' finalizers DELETE their Keycloak objects through
    # this Configuration. If uninstall removed it in the same pass (helm deletes everything at once),
    # every CR would fail its delete forever ("... keycloak-admin not found"). It holds no secret, only
    # a pointer to the token Secret, and a reinstall under the same release name adopts it.
    helm.sh/resource-policy: keep
spec:
  authentication:
    bearer:
      tokenRef:
        name: {{ $v.configuration.tokenSecret.name }}
        namespace: {{ $.Release.Namespace }}
        key: {{ $v.configuration.tokenSecret.key }}
{{- end }}
