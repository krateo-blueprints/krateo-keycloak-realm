# krateo-keycloak-realm
#
# Every object here is a keycloak-config-kog custom resource, reconciled against Keycloak by the
# KOG's controllers (which also heal changes made in the Keycloak console). Install it AFTER
# keycloak-config-kog >= 0.6.0, in the namespace whose token Secret the KOG keeps fresh.

# API group the KOG generates its kinds in (keycloak-config-kog's `resourceGroup`).
resourceGroup: keycloak.ogen.krateo.io

# What happens IN KEYCLOAK when one of this chart's resources is deleted (helm uninstall, a prune, a
# kubectl delete). `orphan` (default): the Kubernetes object goes, the realm, its groups and the client
# stay in Keycloak untouched, so a mistaken uninstall or prune can never wipe the realm and every user
# in it. A reinstall adopts them again. `delete`: Keycloak objects are deleted with their resources;
# set it explicitly only to really decommission the realm. Applied as krateo.io/deletion-policy.
deletionPolicy: orphan

# How the KOG controllers authenticate: one <Kind>Configuration per kind, all pointing at the
# bearer-token Secret keycloak-config-kog rotates.
configuration:
  name: keycloak-admin
  # In the release namespace: install this chart where keycloak-config-kog keeps the token, so no
  # cross-namespace Secret access is ever needed.
  tokenSecret:
    name: keycloak-admin-token
    key: token

realm:
  name: krateo
  displayName: Krateo
  enabled: true
  # Accounts are created only through an administrator-approved joiner flow, never by self-registration.
  registrationAllowed: false
  # "Forgot password" stays available, e.g. for a user whose set-password link expired.
  resetPasswordAllowed: true
  verifyEmail: true
  loginWithEmailAllowed: true
  # Lifetime of administrator-sent action links (the set-password email), in seconds: 72 hours.
  actionTokenGeneratedByAdminLifespan: 259200
  # "Remember me" on the sign-in page. Unticked sessions keep the realm's SSO idle/max timeouts and
  # a browser-session cookie; a ticked session gets a persistent cookie and the two timeouts below
  # (seconds; 0 = use the realm's ordinary SSO timeouts). The defaults are Keycloak's own (off, 0, 0),
  # so a realm that does not set them renders exactly what Keycloak already holds.
  rememberMe: false
  rememberMeSessions:
    idleTimeout: 0
    maxLifespan: 0
  # Offline sessions (refresh tokens of scope offline_access, e.g. personal agents such as OpenClaw, whose MCP SDK
  # always asks for it): the maximum lifetime from creation, in seconds. 0 = no maximum (Keycloak's default: an
  # offline session that keeps being used never expires; only Keycloak's 30-day idle timeout ends it). Default 30
  # days: agents sign in again about monthly. Realm-wide, so it caps every client's offline sessions.
  offlineSessions:
    maxLifespan: 2592000
  # User events (logins, the set-password link, profile changes) kept by Keycloak for `expiration`
  # seconds. `types` must be Keycloak EventType names: CI checks them against the pinned list in
  # hack/testdata (an unknown name is stored by Keycloak without complaint, records nothing, and
  # makes event queries by that type fail with HTTP 500).
  events:
    enabled: true
    # 90 days.
    expiration: 7776000
    types:
      - LOGIN
      - LOGIN_ERROR
      - LOGOUT
      - LOGOUT_ERROR
      - CODE_TO_TOKEN_ERROR
      # The set-password link sent by an administrator: the user opening it, and its failures.
      - EXECUTE_ACTIONS
      - EXECUTE_ACTIONS_ERROR
      - EXECUTE_ACTION_TOKEN
      - EXECUTE_ACTION_TOKEN_ERROR
      - UPDATE_CREDENTIAL
      - UPDATE_CREDENTIAL_ERROR
      - VERIFY_EMAIL
      - VERIFY_EMAIL_ERROR
      - SEND_VERIFY_EMAIL
      - SEND_VERIFY_EMAIL_ERROR
      - SEND_RESET_PASSWORD
      - SEND_RESET_PASSWORD_ERROR
      - RESET_PASSWORD
      - RESET_PASSWORD_ERROR
      - UPDATE_PROFILE
      - UPDATE_PROFILE_ERROR
      - UPDATE_EMAIL
      - UPDATE_EMAIL_ERROR
    listeners:
      - jboss-logging
  # Admin events: what administrators and service accounts change through the Admin API (e.g. a
  # user created by the joiner flow, a set-password email sent). Kept for events.expiration too.
  adminEvents:
    enabled: true
    # Store each change's JSON body too. Off: a user representation carries personal data.
    includeRepresentation: false
  # Outgoing mail. Off by default: an install without SMTP gets a realm that sends nothing.
  smtp:
    enabled: false
    host: ""
    port: "587"
    from: ""
    fromDisplayName: ""
    replyTo: ""
    auth: "true"
    starttls: "true"
    ssl: "false"
    # basic: SMTP AUTH with a password. token: XOAUTH2 with an OAuth2 client-credentials token
    # (Keycloak >= 26.2), required by providers that disable password SMTP AUTH, e.g. Microsoft 365
    # (host smtp.office365.com, port "587", starttls "true").
    authType: basic
    token:
      # e.g. https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token
      url: ""
      clientId: ""
      # Microsoft documents https://outlook.office365.com/.default for SMTP client credentials; the
      # Keycloak server admin guide's example shows https://outlook.office.com/.default. The default
      # follows Microsoft.
      scope: https://outlook.office365.com/.default
    # The SMTP credentials, as keys of one Secret in the release namespace. Placed by the operator of
    # the cluster; never chart values. userKey is the SMTP (SASL) user in both modes, e.g. the sending
    # mailbox for Microsoft 365; passwordKey is used by authType basic, clientSecretKey by token.
    credentialsSecret:
      name: keycloak-smtp
      userKey: username
      passwordKey: password
      clientSecretKey: clientSecret

# Realm groups (top level). Membership is managed by the joiner flow, never here.
# Names are emitted verbatim in the `groups` claim, so they must not start with "/" (that is a group
# PATH) or "system:" (reserved for Kubernetes).
groups:
  - name: tenants
  - name: platform-admins

# Realm users this chart owns (e.g. a demo's personas). NO passwords are rendered: each user sets the
# first one with the login page's "Forgot password?" (needs realm.resetPasswordAllowed and realm.smtp).
# Each renders a KeycloakUser with helm.sh/resource-policy: keep, and the chart's deletionPolicy
# (default orphan) applies to the Keycloak user, so neither an uninstall nor a feature-off deletes a
# person. Real email addresses belong ONLY in a private values file, never in a chart default.
# Group membership is not set here: identity-lifecycle's GroupMembership manages it.
users: []
#  - username: ada                # required; the Keycloak username, unique, case-insensitive
#    name: persona-ada            # optional KeycloakUser OBJECT name; set it to adopt an existing CR in
#                                 # place (default <realm>-<username>, e.g. krateo-ada)
#    firstName: Ada
#    lastName: Persona
#    email: ada@example.com
#    emailVerified: true          # optional
#    enabled: true                # optional, default true

# The realm's declarative user profile: which user attributes exist and who may see or change them.
# Keycloak keeps ONE profile per realm, so this chart owns it whole. It is rendered as Keycloak's own
# default profile (username, email, firstName, lastName and the user-metadata group, verbatim from
# files/keycloak-26-default-user-profile.json, so existing users meet exactly the rules they met
# before) followed by `attributes` below. Attributes that are not declared stay disabled: Keycloak
# drops them (unmanagedAttributePolicy is left unset).
userProfile:
  enabled: true
  # Appended after the four built-ins, which cannot be redeclared here. Keycloak's attribute shape:
  # name, displayName, group, multivalued, validations, annotations, required, permissions, selector.
  attributes:
    # Set by the joiner flow on every user it creates: the uid of the AccessRequest that created the
    # user, so a joiner that crashed before recording the new user's id can still adopt it. Seen and
    # changed only by administrators (the Admin API); never shown to, or editable by, the user.
    - name: krateo-access-request-uid
      displayName: Access request
      permissions:
        view:
          - admin
        edit:
          - admin
      validations:
        length:
          max: 36

# The portal's OIDC client: public (no secret), authorization code + PKCE S256, with a `groups`
# claim carrying bare group names (`tenants`, not `/tenants`).
parentClient:
  enabled: true
  clientId: krateo-portal
  name: Krateo portal
  rootUrl: ""
  # REQUIRED when enabled: the PORTAL FRONTEND's OIDC callback page (it receives Keycloak's redirect and
  # hands the code to authn), not an authn URL; authn never receives the browser redirect. E.g. with
  # host-based exposure https://cmp.example.com/auth?kind=oidc. With path-based exposure (several
  # components on one host) it must not fall under another component's path prefix: if authn is routed
  # at /auth, a callback at /auth lands on authn and sign-in fails. Single-sourced into the OIDCConfig.
  redirectUris: []
  webOrigins: []
  postLogoutRedirectUris: "+"
  groupsClaim: groups

# Confidential relying parties (e.g. Keystone), one KeycloakClient each: authorization code flow with
# a client secret, the same `groups` claim as the portal client, and optional OIDC back-channel logout.
# Each client's secret is generated once by External Secrets Operator into the Secret
# `<clientId>-client-secret` (key `client-secret`) in the release namespace; the relying party syncs that
# Secret into its own namespace. Example (Keystone federation):
#   clients:
#     - clientId: keystone
#       redirectUris:
#         - http://keystone-api.openstack.svc.cluster.local:5000/v3/auth/OS-FEDERATION/identity_providers/keycloak/protocols/openid/websso/redirect
#       backchannelLogout:
#         url: http://horizon-int.openstack.svc.cluster.local/auth/backchannel-logout/
clients: []

# identity-lifecycle's own client (access requests): confidential, service account only, its secret
# generated once into the Secret `secret.name` (key `secret.key`) in the release namespace, which
# identity-lifecycle mounts (accessRequest.keycloak.clientSecretRef). Its service account holds EXACTLY
# `roles` of `roleClientId` (a role added by hand is removed). Needs keycloak-config-kog >= 0.8.0
# (KeycloakServiceAccountRoleMapping).
identityLifecycle:
  enabled: false
  clientId: identity-lifecycle
  secret:
    name: identity-lifecycle-idp
    key: clientSecret
  roleClientId: realm-management
  roles:
    - manage-users
    - view-users
    - query-groups

# The client IDEs (Claude Code, Cursor) sign in with to reach the platform's MCP endpoint: public,
# authorization code + PKCE S256 only, loopback redirects on any port (the IDE picks it). Its access
# token carries preferred_username, the same `groups` claim as the portal client, and `audience` in
# `aud`, which the MCP gateway checks.
# Needs keycloak-config-kog >= 0.9.1 with oasgen-provider >= 0.67.0: the client carries two protocol
# mappers, which Keycloak returns in its own order, and those releases match them by name. With older
# ones the client is created correctly but its KeycloakClient latches Ready=False (DriftNotConverging).
ideClient:
  enabled: false
  clientId: krateo-ide
  name: Krateo IDE (MCP)
  # audience and groupsClaim moved to mcp.audience / mcp.groupsClaim in 0.7.0 (one value for every MCP client);
  # setting them here fails the render, naming the new key.
  redirectUris:
    - http://localhost:*
    - http://127.0.0.1:*

# The MCP resource every MCP client's ACCESS token must name, and the claims the gateway and authn's /delegate
# read. ONE value for the IDE client, the Hermes client and anonymously registered agent clients, so they cannot
# drift from agentgateway-policies' mcpEntry audience and agentiko-mcp-server's subjectAudiences.
mcp:
  # REQUIRED (the render fails without it) when ideClient, hermesClient or agentRegistration is enabled,
  # e.g. https://cmp.example.com/mcp
  audience: ""
  # Claim name of the group-membership mapper (not full path): what authn's allowedGroups reads.
  groupsClaim: groups

# Hermes Agent, pre-registered: a public native client (PKCE S256), redirecting to http://127.0.0.1/callback on any
# port (Keycloak matches a 127.0.0.1 redirect port-agnostically, measured; `localhost` is refused). Fixed redirect:
# Hermes binds 127.0.0.1 and its path is /callback.
hermesClient:
  enabled: false
  clientId: hermes
  name: Hermes Agent (MCP)

# Anonymous dynamic client registration for personal agents (OpenClaw): clients register themselves, start
# DISABLED until an admin enables them, may only redirect to http://127.0.0.1[:port]/oauth/mcp/callback or
# /oauth/callback, and may only request the `mcp` scope (which carries the audience, groups and preferred_username
# claims) and offline_access (which OpenClaw always asks for; see realm.offlineSessions). Adopts the realm's default
# Trusted Hosts / Allowed Client Scopes / Max Clients Limit policies and records CLIENT_REGISTER events (the
# never-enabled cleanup reads them). Needs keycloak-config-kog >= 0.15.0.
agentRegistration:
  enabled: false
  # The realm's cap on registered clients (Keycloak's Max Clients Limit policy).
  maxClients: 200

# The authn OIDCConfig that puts "sign in with Keycloak" on the portal, derived from the same values
# as the client above so the two cannot drift: clientID = parentClient.clientId, redirectURI =
# parentClient.redirectUris[0], allowedGroups = the realm groups. Public client: no secret, so authn
# requires the portal's PKCE verifier. Rendered only where authn's OIDCConfig API exists.
oidcConfig:
  enabled: true
  name: keycloak
  # REQUIRED when enabled: Keycloak's public base URL (the keycloak chart's keycloak.hostname), e.g.
  # https://keycloak.example.com. The issuer is <keycloakUrl>/realms/<realm.name>.
  keycloakUrl: ""
  # Where authn reads the discovery document. Empty = <issuer>/.well-known/openid-configuration.
  # Point it at Keycloak's in-cluster https Service when authn cannot reach the public URL; with
  # Keycloak's hostname-backchannel-dynamic option the document then names in-cluster token and
  # userinfo endpoints while the issuer and the browser's authorization endpoint stay public.
  discoveryUrl: ""
  # Empty = every name in `groups`.
  allowedGroups: []
  additionalScopes: ""
  graphics:
    displayName: Sign in with Keycloak
    icon: key
    backgroundColor: ""
    textColor: ""

