apiVersion: v2
name: krateo-keycloak-realm
description: >-
  A Keycloak parent realm for a Krateo platform, declared as keycloak-config-kog custom resources:
  realm settings (registration off, set-password and verify-email links by email, events), its
  groups, and the portal's public PKCE OIDC client with a groups claim, and the realm's user profile. Requires keycloak-config-kog
  >= 0.7.0 installed and authenticated against the target Keycloak.
type: application
version: CHART_VERSION
appVersion: "1.0.0"
icon: https://raw.githubusercontent.com/krateo-platformops/.github/main/brand/logo.svg
home: https://github.com/krateo-blueprints/krateo-keycloak-realm
# Helm's `sources` is the source code of THIS chart; release tooling resolves the chart version as a
# tag in each listed repository, so only this repository belongs here.
sources:
  - https://github.com/krateo-blueprints/krateo-keycloak-realm
keywords:
  - keycloak
  - realm
  - oidc
maintainers:
  - name: krateo
annotations:
  # Minimum versions, as numbers: 0.3.1 enables 23 event types, which Keycloak returns in its own order;
  # keycloak-config-kog 0.7.1 declares them a set and oasgen-provider 0.62.0 compares sets unordered.
  # On older releases the realm is re-PUT a few times and then latches Ready=False.
  # Never oasgen-provider 0.66.0 (retracted): the KeycloakUserProfile this chart always renders is created
  # together with its realm, and on 0.66.0 a profile whose realm is not there yet at its first observe
  # never turns Ready (oasgen-provider #674, fixed in 0.67.0). ideClient needs more: see values.yaml.
  # keycloak-config-kog >= 0.9.2 since 0.5.3: this chart always renders the two Remember me timeouts, and an
  # older KOG's CRD prunes them silently (measured: the CR keeps rememberMe, loses the timeouts, and stays
  # Ready), so the realm and the KOG move as a pair. KOG 0.9.x itself needs oasgen-provider >= 0.67.0.
  # keycloak-config-kog >= 0.11.0 since 0.6.3: the KeycloakUserConfiguration carries configuration.query.findby.exact,
  # which 0.11.0 declares (an older KOG's Configuration CRD has no `configuration` block and PRUNES it silently, so
  # the user findby would keep reading only Keycloak's first page of 100 users). Measured on 0.11.0 with oasgen 0.80.0.
  krateo.io/requires-keycloak-config-kog: ">= 0.16.0"
  krateo.io/requires-oasgen-provider: ">= 0.67.0"
