# krateo-keycloak-realm
#
# Every object here is a keycloak-config-kog custom resource, reconciled against Keycloak by the
# KOG's controllers (which also heal changes made in the Keycloak console). Install it AFTER
# keycloak-config-kog >= 0.6.0, in the namespace whose token Secret the KOG keeps fresh.

# API group the KOG generates its kinds in (keycloak-config-kog's `resourceGroup`).
resourceGroup: keycloak.ogen.krateo.io

# What happens IN KEYCLOAK when one of this chart's resources is deleted (helm uninstall, a prune, a
# kubectl delete). `orphan` (default): the Kubernetes object goes, the realm, its groups and the client
# stay in Keycloak untouched, so a mistaken uninstall or prune can never wipe the realm and every user
# in it. A reinstall adopts them again. `delete`: Keycloak objects are deleted with their resources;
# set it explicitly only to really decommission the realm. Applied as krateo.io/deletion-policy.
deletionPolicy: orphan

# How the KOG controllers authenticate: one <Kind>Configuration per kind, all pointing at the
# bearer-token Secret keycloak-config-kog rotates.
configuration:
  name: keycloak-admin
  # In the release namespace: install this chart where keycloak-config-kog keeps the token, so no
  # cross-namespace Secret access is ever needed.
  tokenSecret:
    name: keycloak-admin-token
    key: token

realm:
  name: krateo
  displayName: Krateo
  enabled: true
  # Accounts are created only through the access-request flow, never by self-registration.
  registrationAllowed: false
  # "Forgot password" stays available, e.g. for a user whose set-password link expired.
  resetPasswordAllowed: true
  verifyEmail: true
  loginWithEmailAllowed: true
  # Lifetime of administrator-sent action links (the set-password email), in seconds: 72 hours.
  actionTokenGeneratedByAdminLifespan: 259200
  events:
    enabled: true
    types:
      - SEND_EXECUTE_ACTIONS
      - SEND_ERROR
    listeners:
      - jboss-logging
  # Outgoing mail. Off by default: an install without SMTP gets a realm that sends nothing.
  smtp:
    enabled: false
    host: ""
    port: "587"
    from: ""
    fromDisplayName: ""
    replyTo: ""
    auth: "true"
    starttls: "true"
    ssl: "false"
    # basic: SMTP AUTH with a password. token: XOAUTH2 with an OAuth2 client-credentials token
    # (Keycloak >= 26.2), required by providers that disable password SMTP AUTH, e.g. Microsoft 365
    # (host smtp.office365.com, port "587", starttls "true").
    authType: basic
    token:
      # e.g. https://login.microsoftonline.com/<tenant-id>/oauth2/v2.0/token
      url: ""
      clientId: ""
      # Microsoft documents https://outlook.office365.com/.default for SMTP client credentials; the
      # Keycloak server admin guide's example shows https://outlook.office.com/.default. The default
      # follows Microsoft.
      scope: https://outlook.office365.com/.default
    # The SMTP credentials, as keys of one Secret in the release namespace. Placed by the operator of
    # the cluster; never chart values. userKey is the SMTP (SASL) user in both modes, e.g. the sending
    # mailbox for Microsoft 365; passwordKey is used by authType basic, clientSecretKey by token.
    credentialsSecret:
      name: keycloak-smtp
      userKey: username
      passwordKey: password
      clientSecretKey: clientSecret

# Realm groups (top level). Membership is managed elsewhere (identity-lifecycle), never here.
# Names are emitted verbatim in the `groups` claim, so they must not start with "/" (that is a group
# PATH) or "system:" (reserved for Kubernetes).
groups:
  - name: tenants
  - name: platform-admins

# The portal's OIDC client: public (no secret), authorization code + PKCE S256, with a `groups`
# claim carrying bare group names (`tenants`, not `/tenants`).
parentClient:
  enabled: true
  clientId: krateo-portal
  name: Krateo portal
  rootUrl: ""
  # REQUIRED when enabled, e.g. https://cmp.example.com/auth?kind=oidc
  redirectUris: []
  webOrigins: []
  postLogoutRedirectUris: "+"
  groupsClaim: groups
