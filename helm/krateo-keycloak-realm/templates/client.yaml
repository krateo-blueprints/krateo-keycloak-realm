{{- include "kr.check" . }}
{{- $c := .Values.parentClient }}
{{- if $c.enabled }}
# The portal's OIDC client: public (the browser holds no secret), authorization code with PKCE S256
# only, and a `groups` claim with bare group names (full.path "false": `tenants`, not `/tenants`),
# which is what the portal's group-based authorization matches.
apiVersion: {{ .Values.resourceGroup }}/v1
kind: KeycloakClient
metadata:
  name: {{ printf "%s-%s" (include "kr.objName" .Values.realm.name) (include "kr.objName" $c.clientId) | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kr.labels" . | nindent 4 }}
  annotations:
    {{- include "kr.deletionPolicy" . | nindent 4 }}
spec:
  {{- include "kr.configurationRef" . | nindent 2 }}
  realm: {{ .Values.realm.name | quote }}
  clientId: {{ $c.clientId | quote }}
  name: {{ $c.name | quote }}
  enabled: true
  protocol: openid-connect
  publicClient: true
  standardFlowEnabled: true
  implicitFlowEnabled: false
  directAccessGrantsEnabled: false
  serviceAccountsEnabled: false
  {{- with $c.rootUrl }}
  rootUrl: {{ . | quote }}
  {{- end }}
  redirectUris:
    {{- toYaml $c.redirectUris | nindent 4 }}
  {{- with $c.webOrigins }}
  webOrigins:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  attributes:
    pkce.code.challenge.method: S256
    post.logout.redirect.uris: {{ $c.postLogoutRedirectUris | quote }}
  protocolMappers:
    - name: groups
      protocol: openid-connect
      protocolMapper: oidc-group-membership-mapper
      consentRequired: false
      config:
        full.path: "false"
        claim.name: {{ $c.groupsClaim | quote }}
        id.token.claim: "true"
        access.token.claim: "true"
        userinfo.token.claim: "true"
{{- end }}
